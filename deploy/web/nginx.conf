# Include in nginx http context. Issue the named certificate before enabling TLS.
limit_req_zone $binary_remote_addr zone=nav_requests:10m rate=30r/s;
map "$request_method:$uri" $nav_login_key {
    default "";
    "GET:/auth/google/start" $binary_remote_addr;
    "POST:/mfa" $binary_remote_addr;
}
limit_req_zone $nav_login_key zone=nav_login:1m rate=5r/m;

server {
    listen 80;
    server_name nav.jomon.dev;
    if ($host != nav.jomon.dev) { return 444; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://nav.jomon.dev$request_uri; }
}

server {
    listen 443 ssl;
    server_name nav.jomon.dev;
    if ($host != nav.jomon.dev) { return 444; }
    ssl_certificate /etc/letsencrypt/live/nav.jomon.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nav.jomon.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 32k;
    limit_req zone=nav_requests burst=60 nodelay;
    limit_req zone=nav_login burst=8 nodelay;
    limit_req_status 429;
    # Standard OAuth callbacks contain short-lived codes: do not log query strings.
    access_log off;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    # The app owns CSP and Referrer-Policy so native form Origin stays valid.
    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host nav.jomon.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_set_header Remote-User "";
        proxy_set_header X-User "";
        proxy_set_header X-Email "";
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header Connection "";
        # Preserve Authorization: confidential clients use HTTP Basic backchannel auth.
        proxy_cache off;
        proxy_redirect off;
        proxy_read_timeout 30s;
    }
}
